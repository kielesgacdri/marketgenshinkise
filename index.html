    <script>
        const API_URL = '';
        let authMode = 'login'; 

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function switchAuthMode() {
            const phoneInput = document.getElementById('inpPhone');
            const otpInput = document.getElementById('inpOtp');
            const mainBtn = document.getElementById('mainAuthBtn');
            const switchBtn = document.getElementById('switchAuthBtn');
            const title = document.getElementById('authTitle');

            if (authMode === 'login') {
                authMode = 'register_input';
                phoneInput.classList.remove('hidden');
                otpInput.classList.add('hidden');
                mainBtn.innerText = 'Kirim Kode OTP WA';
                switchBtn.innerText = 'Sudah punya akun? Login';
                title.innerText = 'Daftar Akun Baru (Masukkan No WA):';
            } else {
                authMode = 'login';
                phoneInput.classList.add('hidden');
                otpInput.classList.add('hidden');
                mainBtn.innerText = 'Login';
                switchBtn.innerText = 'Belum punya akun? Daftar';
                title.innerText = 'Belum punya akun? Daftar sekarang atau Login.';
            }
        }

        // --- TAMBAHAN EVENT LISTENER SUPAYA TOMBOL DIJAMIN TIDAK KERAS/MACET ---
        document.addEventListener('DOMContentLoaded', () => {
            const mainAuthBtn = document.getElementById('mainAuthBtn');
            if (mainAuthBtn) {
                mainAuthBtn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    await handleAuthAction();
                });
            }
            updateAuthUI();
            fetchProducts();
        });

        async function handleAuthAction() {
            const usernameInput = document.getElementById('inpUser');
            const passwordInput = document.getElementById('inpPass');
            const phoneInput = document.getElementById('inpPhone');
            const otpInput = document.getElementById('inpOtp');

            const username = usernameInput ? usernameInput.value.trim() : '';
            const password = passwordInput ? passwordInput.value.trim() : '';
            const phone = phoneInput ? phoneInput.value.trim() : '';
            const otp = otpInput ? otpInput.value.trim() : '';

            if(!username || !password) {
                alert('Username dan Password wajib diisi!');
                return;
            }

            try {
                if (authMode === 'register_input') {
                    if(!phone) { alert('Nomor WhatsApp wajib diisi!'); return; }
                    
                    const res = await fetch(`${API_URL}/api/send-register-otp`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password, phone })
                    });
                    const data = await res.json();
                    alert(data.message);
                    
                    if(data.success) {
                        authMode = 'register_otp';
                        phoneInput.classList.add('hidden');
                        otpInput.classList.remove('hidden');
                        document.getElementById('mainAuthBtn').innerText = 'Verifikasi & Daftar';
                    }
                } else if (authMode === 'register_otp') {
                    if(!otp) { alert('Masukkan kode OTP yang masuk ke WA!'); return; }
                    
                    const res = await fetch(`${API_URL}/api/verify-register-otp`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, otp })
                    });
                    const data = await res.json();
                    alert(data.message);
                    
                    if(data.success) {
                        localStorage.setItem('username', data.username);
                        localStorage.setItem('role', data.role);
                        updateAuthUI();
                        toggleSidebar();
                    }
                } else {
                    const res = await fetch(`${API_URL}/api/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();
                    alert(data.message);
                    
                    if(data.success) {
                        localStorage.setItem('username', data.username);
                        localStorage.setItem('role', data.role);
                        updateAuthUI();
                        toggleSidebar();
                    }
                }
            } catch (err) {
                alert('Gagal terhubung ke server. Periksa koneksi Anda.');
            }
        }

        function updateAuthUI() {
            const username = localStorage.getItem('username');
            const role = localStorage.getItem('role');

            if(username && role) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('profileSection').classList.remove('hidden');
                const greeting = document.getElementById('userGreeting');
                if(greeting) {
                    greeting.innerText = `Halo, ${username} (${role.toUpperCase()})`;
                    greeting.classList.remove('hidden');
                }
                const loggedText = document.getElementById('loggedAsText');
                if(loggedText) {
                    loggedText.innerText = `Login sebagai: ${username} (${role.toUpperCase()})`;
                }

                const adminPanel = document.getElementById('adminPanel');
                if(role === 'owner') {
                    if(adminPanel) adminPanel.classList.remove('hidden');
                } else {
                    if(adminPanel) adminPanel.classList.add('hidden');
                }
            } else {
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('profileSection').classList.add('hidden');
                const greeting = document.getElementById('userGreeting');
                if(greeting) greeting.classList.add('hidden');
                const adminPanel = document.getElementById('adminPanel');
                if(adminPanel) adminPanel.classList.add('hidden');
            }
        }

        function logout() {
            localStorage.clear();
            updateAuthUI();
            toggleSidebar();
            alert('Berhasil Logout!');
        }

        async function uploadProduct(e) {
            e.preventDefault();
            const productData = {
                title: document.getElementById('title').value,
                server: document.getElementById('server').value,
                price: document.getElementById('price').value,
                image: document.getElementById('image').value,
                description: document.getElementById('description').value,
                role: localStorage.getItem('role')
            };
            const res = await fetch(`${API_URL}/api/products`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(productData)
            });
            const data = await res.json();
            alert(data.message);
            if(data.success) {
                document.getElementById('productForm').reset();
                fetchProducts();
            }
        }

        async function fetchProducts() {
            try {
                const res = await fetch(`${API_URL}/api/products`);
                const products = await res.json();
                const container = document.getElementById('productList');
                container.innerHTML = '';
                if(products.length === 0) {
                    container.innerHTML = `<p class="text-gray-500 col-span-full text-center py-10">Belum ada akun tersedia.</p>`;
                    return;
                }
                products.forEach(p => {
                    container.innerHTML += `
                        <div class="glass rounded-2xl overflow-hidden border border-gray-800 flex flex-col justify-between">
                            <div>
                                <img src="${p.image}" alt="Akun" class="w-full h-48 object-cover">
                                <div class="p-5">
                                    <span class="text-xs bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-md font-semibold border border-amber-500/20">${p.server}</span>
                                    <h3 class="font-bold text-lg mt-2 mb-1">${p.title}</h3>
                                    <p class="text-gray-400 text-xs line-clamp-2 mb-4">${p.description}</p>
                                </div>
                            </div>
                            <div class="p-5 pt-0 flex items-center justify-between">
                                <span class="text-amber-400 font-extrabold text-lg">Rp ${Number(p.price).toLocaleString()}</span>
                                <a href="https://wa.me/6287776951600?text=Halo%20Owner%20Kiel,%20saya%20tertarik%20dengan%20akun%20${encodeURIComponent(p.title)}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition">Beli via WA</a>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.log("Gagal memuat produk");
            }
        }
    </script>
